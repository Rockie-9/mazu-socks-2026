<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 660 660" width="780" height="780">
  <defs>
    <clipPath id="tc"><circle cx="330" cy="330" r="300"/></clipPath>
    <clipPath id="bc"><circle cx="330" cy="330" r="330"/></clipPath>
  </defs>

  <circle cx="330" cy="330" r="330" fill="#F5E1DC" clip-path="url(#bc)"/>

  <g clip-path="url(#tc)">

    <!-- 腳踏實地 -->
    <text x="330" y="108" text-anchor="middle" fill="#3D2B20" font-size="60" font-weight="900"
      font-family="Noto Serif CJK TC,serif" letter-spacing="10">腳踏實地</text>

    <!-- 平安順行 -->
    <text x="330" y="172" text-anchor="middle" fill="#3D2B20" font-size="50" font-weight="700"
      font-family="Noto Serif CJK TC,serif" letter-spacing="8">平安順行</text>

    <!-- Left: 結緣信徒 (vertical, manual stack) -->
    <g fill="#7A5C4F" font-size="15" font-weight="500" font-family="Noto Sans CJK TC,sans-serif" opacity="0.65">
      <text x="150" y="255" text-anchor="middle">結</text>
      <text x="150" y="300" text-anchor="middle">緣</text>
      <text x="150" y="345" text-anchor="middle">信</text>
      <text x="150" y="390" text-anchor="middle">徒</text>
    </g>

    <!-- Right: 送暖弱勢 (vertical, manual stack) -->
    <g fill="#7A5C4F" font-size="15" font-weight="500" font-family="Noto Sans CJK TC,sans-serif" opacity="0.65">
      <text x="510" y="255" text-anchor="middle">送</text>
      <text x="510" y="300" text-anchor="middle">暖</text>
      <text x="510" y="345" text-anchor="middle">弱</text>
      <text x="510" y="390" text-anchor="middle">勢</text>
    </g>

    <!-- Sock icons flanking -->
    <g transform="translate(143,218) scale(0.55)" opacity="0.45">
      <path d="M6,0 C6,0 5,0 5,1 L5,14 C5,15 4,17 2,18 C0,19 0,21 1,22 C2,23 4,23 6,22 L10,19 C12,17 13,15 13,14 L13,1 C13,0 12,0 12,0 Z"
        fill="none" stroke="#A07060" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(517,218) scale(-0.55,0.55)" opacity="0.45">
      <path d="M6,0 C6,0 5,0 5,1 L5,14 C5,15 4,17 2,18 C0,19 0,21 1,22 C2,23 4,23 6,22 L10,19 C12,17 13,15 13,14 L13,1 C13,0 12,0 12,0 Z"
        fill="none" stroke="#A07060" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Thin vertical lines -->
    <line x1="180" y1="220" x2="180" y2="420" stroke="#C4887A" stroke-width="0.4" opacity="0.2"/>
    <line x1="480" y1="220" x2="480" y2="420" stroke="#C4887A" stroke-width="0.4" opacity="0.2"/>

    <!-- QR Code — centered, 230 units = ~21mm on 6cm sticker -->
    <rect x="205" y="205" width="250" height="250" rx="8" fill="white"/>
    <image x="213" y="213" width="234" height="234" href="data:image/png;base64,"/>

    <!-- 掃碼了解詳情與贊助方式 -->
    <text x="330" y="486" text-anchor="middle" fill="#7A5C4F" font-size="14"
      font-weight="400" font-family="Noto Sans CJK TC,sans-serif" letter-spacing="1.5" opacity="0.7">掃碼了解詳情與贊助方式</text>

  </g>
</svg>