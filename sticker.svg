<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 660 660" width="780" height="780">
  <defs>
    <clipPath id="tc"><circle cx="330" cy="330" r="300"/></clipPath>
    <clipPath id="bc"><circle cx="330" cy="330" r="330"/></clipPath>
  </defs>

  <circle cx="330" cy="330" r="330" fill="#F5E1DC" clip-path="url(#bc)"/>

  <g clip-path="url(#tc)">

    <text x="330" y="120" text-anchor="middle" fill="#3D2B20" font-size="50" font-weight="800"
      font-family="Noto Serif CJK TC,serif" letter-spacing="8">腳踏實地</text>

    <text x="330" y="180" text-anchor="middle" fill="#3D2B20" font-size="50" font-weight="800"
      font-family="Noto Serif CJK TC,serif" letter-spacing="8">平安順行</text>

    <!-- [FIX #3] Side text opacity 0.6 → 0.85 -->
    <g fill="#7A5C4F" font-size="20" font-weight="600" font-family="Noto Sans CJK TC,sans-serif" opacity="0.85">
      <text x="95" y="275" text-anchor="middle">結</text>
      <text x="95" y="335" text-anchor="middle">緣</text>
      <text x="95" y="395" text-anchor="middle">信</text>
      <text x="95" y="455" text-anchor="middle">徒</text>
    </g>

    <g fill="#7A5C4F" font-size="20" font-weight="600" font-family="Noto Sans CJK TC,sans-serif" opacity="0.85">
      <text x="565" y="275" text-anchor="middle">送</text>
      <text x="565" y="335" text-anchor="middle">暖</text>
      <text x="565" y="395" text-anchor="middle">弱</text>
      <text x="565" y="455" text-anchor="middle">勢</text>
    </g>

    <!-- [FIX #4] Sock icons REMOVED (unprintable at this size) -->

    <!-- [FIX #1] QR white bg rx=10 → rx=3 -->
    <rect x="143" y="210" width="374" height="374" rx="3" fill="white"/>
    <!-- [FIX #6] QR color darkened for outdoor scanning -->
    <image x="151" y="218" width="358" height="358" href="data:image/png;base64,"/>

    <!-- [FIX #5] Bottom text moved up: y=610 → y=590 -->
    <text x="330" y="590" text-anchor="middle" fill="#7A5C4F" font-size="14"
      font-weight="400" font-family="Noto Sans CJK TC,sans-serif" letter-spacing="2" opacity="0.8">掃碼了解詳情與贊助方式</text>

  </g>
</svg>